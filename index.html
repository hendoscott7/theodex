<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>theodex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111; --dim: #8d8d8d; --card: #efefef; --gap: clamp(12px, 1.6vw, 24px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fafafa; color: var(--ink); }
  body { font: 400 18px/1.3 "Instrument Serif", Georgia, serif; -webkit-font-smoothing: antialiased; padding: var(--gap); }
  a { color: inherit; text-decoration: none; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: clamp(12px, 2vw, 28px) clamp(20px, 4vw, 64px) clamp(28px, 4vw, 56px);
  }
  .logo { font: 500 clamp(22px, 1.8vw, 28px)/1 "Inter", system-ui, sans-serif; letter-spacing: -.035em; }
  .clock { width: clamp(32px, 2.6vw, 42px); height: auto; }
  .clock .face { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .clock line { stroke: var(--ink); stroke-linecap: round; }
  .clock .s { stroke: #b0b0b0; }

  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }

  .card {
    position: relative; background: var(--card); border-radius: clamp(24px, 2.6vw, 40px);
    padding: clamp(28px, 4vw, 64px); overflow: hidden;
    display: grid; grid-template-rows: auto 1fr auto; gap: clamp(28px, 4vw, 56px);
    min-height: clamp(520px, 52vw, 760px);
    isolation: isolate;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .6s;
    background:
      radial-gradient(60% 55% at var(--x, 50%) var(--y, 40%), rgba(255,255,255,.95), rgba(255,255,255,0) 70%),
      radial-gradient(80% 70% at calc(100% - var(--x, 50%)) 100%, rgba(214,226,255,.7), rgba(214,226,255,0) 70%),
      radial-gradient(70% 60% at 0% 0%, rgba(255,228,214,.6), rgba(255,228,214,0) 70%);
  }
  .card:hover::before { opacity: 1; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; }
  .name { margin: 0; font-weight: 400; font-size: clamp(44px, 4.6vw, 80px); line-height: .92; letter-spacing: -.025em; }
  .btn {
    flex: none; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.7);
    display: grid; place-items: center; margin-top: 6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
    transform: scale(.85); opacity: .6;
    transition: transform .4s cubic-bezier(.2,.7,.2,1), opacity .4s, background .4s, box-shadow .4s;
  }
  .btn svg { width: 16px; height: 16px; stroke: var(--ink); stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .card:hover .btn { transform: none; opacity: 1; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.05), 0 10px 26px rgba(0,0,0,.08); }

  /* the short screen */
  .stage { display: grid; place-items: center; }
  .screen {
    width: 86%; aspect-ratio: 16 / 10; border-radius: 18px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 30px 60px -24px rgba(0,0,0,.3);
    transform: translateY(6px) scale(.98);
    transition: transform .7s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover .screen { transform: translateY(0) scale(1); }
  .screen-in { width: 100%; height: 100%; overflow: hidden; position: relative; background: #e4e4e3; }
  .screen img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.02); transition: transform 1.2s cubic-bezier(.2,.7,.2,1); }
  .card:hover .screen img { transform: scale(1); }
  .soon { position: absolute; inset: 0; display: grid; place-items: center; color: #a3a3a3; font-style: italic; font-size: clamp(22px, 2vw, 30px); }

  .line { margin: 0; color: var(--dim); font: 400 clamp(15px, 1.15vw, 17px)/1.45 "Inter", system-ui, sans-serif; letter-spacing: -.01em; max-width: 30em; }

  footer { padding: clamp(28px, 4vw, 56px) clamp(20px, 4vw, 64px); color: var(--dim); font: 400 14px/1.3 "Inter", system-ui, sans-serif; letter-spacing: -.01em; }

  @media (max-width: 900px) { main { grid-template-columns: 1fr; } .card { min-height: 0; } }
  @media (prefers-reduced-motion: reduce) { .card *, .card { transition: none !important; } }
</style>
</head>
<body>
<header>
  <a class="logo" href="./">theodex</a>
  <svg class="clock" viewBox="0 0 40 40" role="img" aria-label="Clock">
    <circle class="face" cx="20" cy="20" r="18.5"/>
    <line id="hh" x1="20" y1="20" x2="20" y2="10.5" stroke-width="2"/>
    <line id="mh" x1="20" y1="20" x2="20" y2="6" stroke-width="1.5"/>
    <line id="sh" class="s" x1="20" y1="22.5" x2="20" y2="5" stroke-width="1"/>
    <circle cx="20" cy="20" r="1.4" fill="currentColor"/>
  </svg>
</header>

<main id="works"></main>

<footer>Things made for Theo.</footer>

<script>
// Add works here: name, one short line, link, still image and last-updated date.
// Cards sort themselves, newest first. Leave image out to show "Coming soon".
const WORKS = [
  { name: "Harry's Knoll", line: "A painted knoll to mow, and a hedgehog to feed.", url: "https://hendoscott7.github.io/harrys-knoll/", image: "img/harrys-knoll.jpg", updated: "2026-11-08T18:50" },
  { name: "T-Time", line: "Spin for tonight's dinner.", url: "https://hendoscott7.github.io/t-time/", image: "img/t-time.jpg", updated: "2026-11-08T21:50" }
].sort((a, b) => b.updated.localeCompare(a.updated));

const grid = document.getElementById('works');
WORKS.forEach(w => {
  const card = document.createElement(w.url ? 'a' : 'div');
  card.className = 'card';
  if (w.url) card.href = w.url;
  card.innerHTML = `
    <div class="top"><h2 class="name">${w.name}</h2>${w.url ? '<span class="btn" aria-label="Open"><svg viewBox="0 0 16 16"><path d="M4.5 11.5l7-7M6 4.5h5.5V10"/></svg></span>' : ''}</div>
    <div class="stage"><div class="screen"><div class="screen-in">
      ${w.image ? `<img src="${w.image}" alt="${w.name}">` : '<span class="soon">Coming soon</span>'}
    </div></div></div>
    <p class="line">${w.line}</p>`;
  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    card.style.setProperty('--x', ((e.clientX - r.left) / r.width * 100) + '%');
    card.style.setProperty('--y', ((e.clientY - r.top) / r.height * 100) + '%');
  });
  grid.appendChild(card);
});

const hands = { h: document.getElementById('hh'), m: document.getElementById('mh'), s: document.getElementById('sh') };
function tick() {
  const d = new Date(), sec = d.getSeconds(), min = d.getMinutes() + sec / 60, hr = d.getHours() % 12 + min / 60;
  hands.h.setAttribute('transform', `rotate(${hr * 30} 20 20)`);
  hands.m.setAttribute('transform', `rotate(${min * 6} 20 20)`);
  hands.s.setAttribute('transform', `rotate(${sec * 6} 20 20)`);
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
