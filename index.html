<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>theodex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0c0c0c; --soft: rgba(0,0,0,.42); --bar: #f1f1f1; --ease: cubic-bezier(.65,0,.2,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 400 14px/1.25 "Inter", "Helvetica Neue", Arial, sans-serif; color: var(--ink); background: transparent;
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* corner labels */
  .top { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 24px; background: #fff; }
  .logo { font-size: 26px; font-weight: 600; letter-spacing: -.04em; }
  .logo span { color: #b9b9b9; }
  .for { font-size: 15px; color: #b9b9b9; letter-spacing: -.02em; }

  /* bands */
  .bands { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .band {
    position: relative; flex: 0 0 var(--closed, 132px); min-height: 0; overflow: hidden;
    background: var(--c); display: grid; grid-template-columns: 1fr minmax(260px, 34%); cursor: pointer;
    transition: flex-basis .32s var(--ease), flex-grow .32s var(--ease), box-shadow .25s;
  }
  .band.on { flex: 1 0 var(--closed, 132px); z-index: 1; }
  /* the open card casts its shadow up onto the card above; the top card has none */
  .band.on:not(:first-child) { box-shadow: 0 -12px 28px -10px rgba(0,0,0,.32); }
  .main { display: grid; grid-template-columns: 64px 1fr; column-gap: 22px; align-content: start; padding: 20px 24px; }
  .num, .go {
    width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
    font-size: 22px; font-weight: 600;
  }
  .num { background: rgba(0,0,0,.08); margin-top: 12px; }
  .go {
    background: var(--ink); color: var(--c); margin-top: 6px;
    transform: scale(.4); opacity: 0; transition: transform .25s var(--ease), opacity .15s;
  }
  .go svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .band.on .go { transform: none; opacity: 1; transition-delay: .08s; }
  .band:not(.on) .go { pointer-events: none; visibility: hidden; }   /* only an open card can be entered */
  .name { font-weight: 800; font-size: clamp(56px, 7.4vw, 112px); line-height: .9; letter-spacing: -.055em; margin: 0; white-space: nowrap; }
  .name + .name { grid-column: 2; }
  .rest { display: none; }
  .go { margin-top: 14px; }
  .go { grid-row: 2; grid-column: 1; align-self: center; }

  .side { border-left: 1px solid rgba(0,0,0,.14); margin: 18px 0; padding: 4px 24px 4px 24px;
          display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto 1fr auto; column-gap: 16px; }
  .side h3 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; }
  .side p { margin: 24px 0 0; color: var(--soft); font-size: 15px; line-height: 1.15; max-width: 16em; }
  .side .when { grid-row: 4; font-weight: 600; font-size: 13px; opacity: 0; transition: opacity .2s; }
  .band.on .when { opacity: 1; transition-delay: .1s; }
  .icon { grid-column: 2; grid-row: 1 / 3; width: 76px; height: 76px; }
  .icon svg { width: 100%; height: 100%; overflow: visible; stroke: var(--ink); color: var(--ink); stroke-width: 3.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon .ghost { opacity: .45; stroke-width: 1.6; }
  .shot {
    grid-column: 1 / -1; grid-row: 3; align-self: center; margin-top: 18px; width: 100%; aspect-ratio: 16 / 10; max-height: 100%;
    object-fit: cover; border-radius: 7px; display: block; box-shadow: 0 20px 40px -18px rgba(0,0,0,.35);
    opacity: 0; transform: translateY(10px); transition: opacity .2s, transform .3s var(--ease);
  }
  .band.on .shot { opacity: 1; transform: none; transition-delay: .06s; }

  .right { display: flex; align-items: center; gap: 14px; }
  .top { align-items: center; }

  @media (max-width: 760px) {
    body { height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; }
    .top { padding: 14px 16px; position: sticky; top: 0; z-index: 10; background: #fff; }
    .logo { font-size: 22px; }
    .for { font-size: 13px; }
      .bands { flex: 1 0 auto; }
    .band { display: block; flex: none !important; overflow: visible; }
    .band:last-child { flex: 1 0 auto !important; min-height: 40vh; }   /* last colour runs to the bottom */
    .main { grid-template-columns: 40px 1fr 40px; column-gap: 14px; padding: 18px 16px; align-items: center; }
    .num, .go { width: 40px; height: 40px; font-size: 16px; margin: 0; }
    .go { grid-row: 1; grid-column: 3; }
    .go svg { width: 18px; height: 18px; }
    .name { font-size: clamp(32px, 9.6vw, 48px); letter-spacing: -.05em; line-height: 1; overflow: visible; }
    .name ~ .name { display: none; }
    .rest { display: inline; }
    .side br { display: none; }

    /* details slide open */
    .side {
      display: grid; grid-template-rows: auto auto auto auto; border-left: 0; border-top: 1px solid transparent;
      margin: 0 16px; padding: 0; max-height: 0; overflow: hidden; opacity: 0;
      transition: max-height .4s var(--ease), padding .4s var(--ease), opacity .25s, border-color .25s;
    }
    .band.on .side { max-height: 1000px; padding: 14px 0 20px; opacity: 1; border-top-color: rgba(0,0,0,.14); transition-delay: 0s, 0s, .08s, 0s; }
    .side h3, .side p { font-size: 14px; }
    .side p { margin-top: 10px; max-width: none; }
    .icon { width: 48px; height: 48px; }
    .shot { margin-top: 18px; }
    .side .when { margin-top: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { .band, .go, .shot, .when, .ruler .head { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="./">theo<span>dex</span></a>
  <span class="right"><span class="for">Things made for Theo</span></span>
</header>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough-a"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2.6"/></filter>
  <filter id="rough-b"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="11"/><feDisplacementMap in="SourceGraphic" scale="3.4"/></filter>
</svg>
<main class="bands" id="bands"></main>


<script>
// Add works here. Bands show in this order, top to bottom.
// name: one or two lines. title + text: the small column. icon: SVG paths on a 64×64 grid.
const WORKS = [
  {
    name: ["Harry's", "Knoll"], color: "#96a46f",
    title: "A painted knoll\nto wander", text: "Mow the lawn in stripes.\nFeed Harry the hedgehog.",
    url: "https://hendoscott7.github.io/harrys-knoll/", image: "img/harrys-knoll.jpg", updated: "2026-11-08T18:50",
    icon: '<path d="M10 46C9 33 20 22 33 22C42 22 48 26 52 31C55 34 58 38 59 41C59.5 44 55 45.5 50 45.5C36 46.5 22 46.2 10 46Z"/><path d="M14 34l-7-3M18 28l-5-6M25 24l-2-8M32 22l1-9M39 23l4-7M46 27l7-4M50 33l7-1"/><circle cx="49" cy="37" r="1.4" fill="currentColor"/><circle cx="59" cy="42" r="1.2" fill="currentColor"/><path d="M20 46l-1 5M38 46l1 5"/>'
  },
  {
    name: ["T-Time"], color: "#f5d873",
    title: "Spin for\ntonight's dinner", text: "Veto what he won't eat.\nKeep what he will.",
    url: "https://hendoscott7.github.io/t-time/", image: "img/t-time.jpg", updated: "2026-11-08T21:50",
    icon: '<path d="M8 34C20 32.5 44 32.5 56 34C55 48 45 55.5 32 55.5C19 55.5 9.5 48 8 34Z"/><path d="M24 55.5L23 59C29 59.5 35 59.5 41 59L40 55.5"/><path d="M23 27C19 22 27 18.5 23 12M32.5 27C28.5 21 36.5 17.5 32.5 10M42 27C38 22 46 18.5 42 13"/><path d="M46 33.5L56.5 21.5"/><ellipse cx="58.5" cy="19" rx="2.6" ry="3.6" transform="rotate(40 58.5 19)"/>'
  }
];

const $ = id => document.getElementById(id);
// Paint the page itself in the bottom card's colour, so Safari's toolbar area,
// overscroll and anything below the last card match it.
const base = WORKS[WORKS.length - 1].color;
document.documentElement.style.backgroundColor = base;
document.body.style.backgroundColor = base;
const bandsEl = $('bands');
const fmt = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
const nl = s => s.replace(/\n/g, ' <br>');

WORKS.forEach((w, i) => {
  const b = document.createElement('section');
  b.className = 'band'; b.style.setProperty('--c', w.color);
  b.innerHTML = `
    <div class="main">
      <span class="num">${i + 1}</span><h2 class="name">${w.name[0]}${w.name[1] ? `<span class="rest"> ${w.name[1]}</span>` : ''}</h2>
      <a class="go" href="${w.url}" aria-label="Open ${w.name.join(' ')}"><svg viewBox="0 0 24 24"><path d="M5 12h13M12 5.5L18.5 12 12 18.5"/></svg></a>${w.name[1] ? `<h2 class="name" aria-hidden="true">${w.name[1]}</h2>` : ''}
    </div>
    <div class="side">
      <h3>${nl(w.title)}</h3>
      <span class="icon"><svg viewBox="0 0 64 64"><g filter="url(#rough-a)">${w.icon}</g><g filter="url(#rough-b)" class="ghost">${w.icon}</g></svg></span>
      <p>${nl(w.text)}</p>
      <img class="shot" src="${w.image}" alt="${w.name.join(' ')}">
      <span class="when">Updated ${fmt(w.updated)}</span>
    </div>`;
  b.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') select(i); });
  // Tapping a band only opens or closes it. The black arrow is the only way into a work.
  b.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (a && current === i) return;                 // arrow on the open card: go
    if (a) e.preventDefault();
    select(current === i ? -1 : i);
  });
  bandsEl.appendChild(b);
});

let current = -1;
bandsEl.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') select(WORKS.length - 1); });
// Lands with the bottom card open; hovering a card opens it.
function select(i) {
  current = i < 0 ? -1 : (i + WORKS.length) % WORKS.length;
  [...bandsEl.children].forEach((b, k) => b.classList.toggle('on', k === current));
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') select(current + 1);
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') select(current <= 0 ? WORKS.length - 1 : current - 1);
  if (e.key === 'Enter' && current >= 0) location.href = WORKS[current].url;
});
select(WORKS.length - 1);

</script>
</body>
</html>
